    /* Background canvas */
    #mlp-bg {
      position: fixed;

      background: black;
    }

    .social-icons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .social-icons a {
      color: #8b9fcf;
      font-size: 1.1rem;
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(120,140,210,0.25);
      display: flex; align-items: center; justify-content: center;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      text-decoration: none;
    }

    .social-icons a:hover {
      color: #fff;
      border-color: rgba(150,130,230,0.6);
      background: rgba(120,90,220,0.14);
    }

    /* Container για το D3 Γράφημα */
    .research-graph-container {
      width: 100%;
      height: 380px;
      margin: 25px 0;
      background: rgba(12, 18, 35, 0.45);
      border: 1px solid rgba(120, 140, 210, 0.15);
      border-radius: 16px;
      backdrop-filter: blur(8px);
      overflow: hidden;
      position: relative;
    }

    .graph-tooltip {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 28, 50, 0.85);
      border: 1px solid rgba(167, 139, 250, 0.4);
      color: #e2e8f0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      pointer-events: none;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    /* SVG Node styling */
    .node circle {
      cursor: pointer;
      stroke-width: 1.5px;
      transition: r 0.2s, stroke-width 0.2s;
    }
    .node text {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11px;
      fill: #cbd5e1;
      pointer-events: none;
      user-select: none;
    }
    .link {
      stroke-opacity: 0.25;
      stroke-width: 1.2px;
    }

    /* Sleek Language Dropdown Integration */
    .lang-dropdown-wrapper {
      position: fixed;
      top: 16px;
      right: 70px;
      z-index: 1000;
      display: inline-block;
    }

    .lang-dropdown-wrapper i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #8b9fcf;
      pointer-events: none;
      font-size: 0.85rem;
    }

    .lang-toggle-select {
      background: rgba(20, 28, 50, 0.75);
      border: 1px solid rgba(120, 140, 210, 0.3);
      color: #8b9fcf;
      padding: 6px 14px 6px 30px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
      backdrop-filter: blur(6px);
      letter-spacing: 0.05em;
      appearance: none;
      -webkit-appearance: none;
    }

    .lang-toggle-select:hover {
      border-color: rgba(150, 130, 230, 0.6);
      color: #fff;
      background: rgba(120, 90, 220, 0.18);
    }

    .lang-toggle-select option {
      background: #0c1223;
      color: #cbd5e1;

    // --- Dynamic D3 Node Declarations globally scoped to adjust dynamically ---
    let rawGraphData = [
      { id: "Stefanos", group: "core", radius: 14, color: "#ffffff", i18nKey: "node-stefanos" },
      { id: "6G Networks", group: "pillar", radius: 10, color: "#a78bfa", target: "projects.html#6g", i18nKey: "node-6g" },
      { id: "Federated Learning", group: "pillar", radius: 10, color: "#a78bfa", target: "projects.html#federated-learning", i18nKey: "node-fl" },
      { id: "Optimization", group: "pillar", radius: 10, color: "#a78bfa", target: "projects.html#optimization", i18nKey: "node-opt" },
      { id: "RIS / Beamforming", group: "tech", radius: 7, color: "#8b9fcf", target: "projects.html#ris", i18nKey: "node-ris" },
      { id: "Resource Allocation", group: "tech", radius: 7, color: "#8b9fcf", target: "projects.html#resource-allocation", i18nKey: "node-res" },
      { id: "Distributed Intelligence", group: "tech", radius: 7, color: "#8b9fcf", target: "projects.html#ml", i18nKey: "node-dist" },
      { id: "CVXPY / Gurobi", group: "tech", radius: 6, color: "#64748b", target: "projects.html#tools", i18nKey: "node-tools" },
      { id: "Python / Data Science", group: "tech", radius: 6, color: "#64748b", target: "projects.html#tools", i18nKey: "node-ds" }
    ];

    let links = [
      { source: "Stefanos", target: "6G Networks" },
      { source: "Stefanos", target: "Federated Learning" },
      { source: "Stefanos", target: "Optimization" },
      { source: "6G Networks", target: "RIS / Beamforming" },
      { source: "6G Networks", target: "Resource Allocation" },
      { source: "Federated Learning", target: "Distributed Intelligence" },
      { source: "Federated Learning", target: "Resource Allocation" },
      { source: "Optimization", target: "CVXPY / Gurobi" },
      { source: "Optimization", target: "Resource Allocation" },
      { source: "Distributed Intelligence", target: "Python / Data Science" }
    ];

    let d3NodeTextSelection; 

    // --- Master Translation Execution Engine ---
    function translatePage(lang) {
      // Safe fallback mechanism if translations are not yet provided for all 20 options
      const dict = i18nData[lang] || i18nData["en"];
      localStorage.setItem('preferredLang', lang);
      document.getElementById("language-selector").value = lang;

      // Translate standard text arrays
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (dict[key]) el.textContent = dict[key];
      });

      // Handle HTML paragraph blocks cleanly
      if (dict["about-p1"]) document.getElementById("about-p1").innerHTML = dict["about-p1"];
      if (dict["about-p2"]) document.getElementById("about-p2").innerHTML = dict["about-p2"];
      
      // Update interactive tooltip base strings
      const currentTip = document.getElementById("graph-tip");
      if (currentTip && dict["tip-default"]) currentTip.innerHTML = dict["tip-default"];

      // Reactive update to the live D3 Canvas strings safely
      if (d3NodeTextSelection) {
        d3NodeTextSelection.text(d => dict[d.i18nKey] || d.id);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      // D3 Topology Map Initialization Setup
      const container = document.getElementById("d3-container");
      const width = container.clientWidth;
      const height = container.clientHeight;

      const svg = d3.select("#d3-container")
        .append("svg")
        .attr("width", "100%")
        .attr("height", "100%")
        .attr("viewBox", `0 0 ${width} ${height}`);

      const simulation = d3.forceSimulation(rawGraphData)
        .force("link", d3.forceLink(links).id(d => d.id).distance(75))
        .force("charge", d3.forceManyBody().strength(-140))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collision", d3.forceCollide().radius(d => d.radius + 15));

      const link = svg.append("g")
        .attr("class", "links")
        .selectAll("line")
        .data(links)
        .enter().append("line")
        .attr("class", "link")
        .attr("stroke", "rgba(139, 159, 207, 0.3)");

      const node = svg.append("g")
        .attr("class", "nodes")
        .selectAll(".node")
        .data(rawGraphData)
        .enter().append("g")
        .attr("class", "node")
        .call(d3.drag()
          .on("start", dragstarted)
          .on("drag", dragged)
          .on("end", dragended));

      node.append("circle")
        .attr("r", d => d.radius)
        .attr("fill", d => d.group === "core" ? "transparent" : d.color)
        .attr("stroke", d => d.color)
        .attr("stroke-width", d => d.group === "core" ? 2 : 1.5)
        .on("mouseover", function(event, d) {
          d3.select(this).attr("r", d.radius + 3).attr("stroke-width", 2.5);
          if (d.target) {
            const currentLang = localStorage.getItem('preferredLang') || 'en';
            const dict = i18nData[currentLang] || i18nData["en"];
            const resolvedNodeName = dict[d.i18nKey] || d.id;
            
            document.getElementById("graph-tip").innerHTML = dict["tip-hover"].replace("{node}", resolvedNodeName);
          }
        })
        .on("mouseout", function(event, d) {
          d3.select(this).attr("r", d.radius).attr("stroke-width", d.group === "core" ? 2 : 1.5);
          const currentLang = localStorage.getItem('preferredLang') || 'en';
          document.getElementById("graph-tip").innerHTML = i18nData[currentLang]["tip-default"];
        })
        .on("click", (event, d) => {
          if (d.target) {
            window.location.href = d.target;
          }
        });

      // Bind text pointers to global handler
      d3NodeTextSelection = node.append("text")
        .attr("dx", d => d.radius + 6)
        .attr("dy", ".35em")
        .style("font-weight", d => d.group === "core" || d.group === "pillar" ? "600" : "400")
        .style("fill", d => d.group === "core" ? "#fff" : "#cbd5e1");

      simulation.on("tick", () => {
        link
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);

        node.attr("transform", d => `translate(${d.x},${d.y})`);
      });

      function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
      }

      function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
      }

      function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
      }

      window.addEventListener("resize", () => {
        const w = container.clientWidth;
        const h = container.clientHeight;
        simulation.force("center", d3.forceCenter(w / 2, h / 2)).alpha(0.1).restart();
      });

      // Run runtime tracking language configuration
      const savedLang = localStorage.getItem('preferredLang') || 'en';
      translatePage(savedLang);
    });
  </script>
</body>

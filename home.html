    .research-graph-container {
      width: 100%;
      height: 420px;
      margin: 25px 0;

      border: 1px solid rgba(147, 51, 234, 0.2);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: inset 0 0 24px rgba(139, 92, 246, 0.05), 0 10px 30px rgba(0,0,0,0.5);
      overflow: hidden;
      position: relative;
    }

    /* Mathematical Faint Grid Overlay */
    .research-graph-container::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 20px 20px;
      pointer-events: none;
    }

    .graph-tooltip {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 15, 30, 0.9);
      border: 1px solid rgba(139, 92, 246, 0.4);
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
      color: #f1f5f9;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 500;
      pointer-events: none;
      white-space: nowrap;
      letter-spacing: 0.03em;
      transition: all 0.2s ease;
    }

    /* SVG Node styling */
    .node circle {
      cursor: pointer;
      stroke-width: 2px;
      transition: r 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), stroke-width 0.3s, filter 0.3s, opacity 0.3s;
    }

      font-family: system-ui, -apple-system, sans-serif;

      pointer-events: none;

      transition: fill 0.3s, font-size 0.3s, opacity 0.3s;
    } */
    .node text {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11px;
      fill: currentColor; /* Inherits system text colors across dark/light transitions */
      pointer-events: none;
      user-select: none;
      transition: fill 0.3s, font-size 0.3s, opacity 0.3s;
    }
    .link {
      stroke-opacity: 0.15;
      stroke-width: 1.5px;
      transition: stroke-opacity 0.3s, stroke 0.3s, stroke-width 0.3s;
    }

    /* Highlighting context classes */
    .node.dimmed circle, .node.dimmed text {
      opacity: 0.25;
    }
    .link.dimmed {
      stroke-opacity: 0.05;
    }
    .link.highlighted {
      stroke-opacity: 0.8;
      stroke-width: 2.5px;
    }

    z-index: 1000;

    // --- Dynamic D3 Node Declarations globally scoped to adjust dynamically ---
    let rawGraphData = [
      { id: "Stefanos", group: "core", radius: 15, color: "#38bdf8", i18nKey: "node-stefanos" },
      { id: "6G Networks", group: "pillar", radius: 11, color: "#a78bfa", target: "projects.html#6g", i18nKey: "node-6g" },
      { id: "Federated Learning", group: "pillar", radius: 11, color: "#f43f5e", target: "projects.html#federated-learning", i18nKey: "node-fl" },
      { id: "Optimization", group: "pillar", radius: 11, color: "#10b981", target: "projects.html#optimization", i18nKey: "node-opt" },
      { id: "RIS / Beamforming", group: "tech", radius: 7.5, color: "#c084fc", target: "projects.html#ris", i18nKey: "node-ris" },
      { id: "Resource Allocation", group: "tech", radius: 7.5, color: "#f472b6", target: "projects.html#resource-allocation", i18nKey: "node-res" },
      { id: "Distributed Intelligence", group: "tech", radius: 7.5, color: "#fb7185", target: "projects.html#ml", i18nKey: "node-dist" },
      { id: "CVXPY / Gurobi", group: "tech", radius: 6.5, color: "#34d399", target: "projects.html#tools", i18nKey: "node-tools" },
      { id: "Python / Data Science", group: "tech", radius: 6.5, color: "#38bdf8", target: "projects.html#tools", i18nKey: "node-ds" }
    ];

    let links = [
      { source: "Stefanos", target: "6G Networks" },
      { source: "Stefanos", target: "Federated Learning" },
      { source: "Stefanos", target: "Optimization" },
      { source: "6G Networks", target: "RIS / Beamforming" },
      { source: "6G Networks", target: "Resource Allocation" },
      { source: "Federated Learning", target: "Distributed Intelligence" },
      { source: "Federated Learning", target: "Resource Allocation" },
      { source: "Optimization", target: "CVXPY / Gurobi" },
      { source: "Optimization", target: "Resource Allocation" },
      { source: "Distributed Intelligence", target: "Python / Data Science" }
    ];

    let d3NodeTextSelection; 

    // --- Master Translation Execution Engine ---
    function translatePage(lang) {
      const dict = i18nData[lang] || i18nData["en"];
      localStorage.setItem('preferredLang', lang);
      document.getElementById("language-selector").value = lang;

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (dict[key]) el.textContent = dict[key];
      });

      // Μετάφραση placeholders σε πεδία εισαγωγής
      document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
          const key = el.getAttribute("data-i18n-placeholder");
          if (dict[key]) {
              el.placeholder = dict[key];
          }
      });
      if (dict["about-p1"]) document.getElementById("about-p1").innerHTML = dict["about-p1"];
      if (dict["about-p2"]) document.getElementById("about-p2").innerHTML = dict["about-p2"];
      
      const currentTip = document.getElementById("graph-tip");
      if (currentTip && dict["tip-default"]) currentTip.innerHTML = dict["tip-default"];

      if (d3NodeTextSelection) {
        d3NodeTextSelection.text(d => dict[d.i18nKey] || d.id);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("d3-container");
      const width = container.clientWidth;
      const height = container.clientHeight;

      const svg = d3.select("#d3-container")
        .append("svg")
        .attr("width", "100%")
        .attr("height", "100%")
        .attr("viewBox", `0 0 ${width} ${height}`);

      // --- ADVANCED FILTER DEFINITION: Neon Glow Filters ---
      const defs = svg.append("defs");
      
      const glowFilter = defs.append("filter")
        .attr("id", "neon-glow")
        .attr("x", "-50%")
        .attr("y", "-50%")
        .attr("width", "200%")
        .attr("height", "200%");

      glowFilter.append("feGaussianBlur")
        .attr("stdDeviation", "4")
        .attr("result", "blur");

      glowFilter.append("feMerge")
        .selectAll("feMergeNode")
        .data(["blur", "SourceGraphic"])
        .enter().append("feMergeNode")
        .attr("in", d => d);

      const simulation = d3.forceSimulation(rawGraphData)
        .force("link", d3.forceLink(links).id(d => d.id).distance(80))
        .force("charge", d3.forceManyBody().strength(-160))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collision", d3.forceCollide().radius(d => d.radius + 20));

      const link = svg.append("g")
        .attr("class", "links")
        .selectAll("line")
        .data(links)
        .enter().append("line")
        .attr("class", "link")
        .attr("stroke", d => "#475569");

      const node = svg.append("g")
        .attr("class", "nodes")
        .selectAll(".node")
        .data(rawGraphData)
        .enter().append("g")
        .attr("class", "node")
        .call(d3.drag()
          .on("start", dragstarted)
          .on("drag", dragged)
          .on("end", dragended));

      node.append("circle")
        .attr("r", d => d.radius)
        .attr("fill", d => d.color)
        .attr("stroke", d => d.color)
        .attr("stroke-width", 2)
        .style("filter", "url(#neon-glow)") // Apply premium glow filter to all structural vertices
        .on("mouseover", function(event, d) {
          const currentLang = localStorage.getItem('preferredLang') || 'en';
          const dict = i18nData[currentLang] || i18nData["en"];
          
          // Magnify targeted node instantly
          d3.select(this).attr("r", d.radius + 4).attr("stroke-width", 3);
          
          // Dynamic Neighbor Highlighting Interaction Loop
          node.classed("dimmed", n => n.id !== d.id && !isNeighbor(d, n));
          link.classed("dimmed", l => l.source.id !== d.id && l.target.id !== d.id);
          link.classed("highlighted", l => l.source.id === d.id || l.target.id === d.id);
          if(link.classed("highlighted")) {
            link.filter(l => l.source.id === d.id || l.target.id === d.id).attr("stroke", d.color);
          }

          if (d.target) {
            const resolvedNodeName = dict[d.i18nKey] || d.id;
            document.getElementById("graph-tip").innerHTML = dict["tip-hover"].replace("{node}", resolvedNodeName);
          }
        })
        .on("mouseout", function(event, d) {
          d3.select(this).attr("r", d.radius).attr("stroke-width", 2);
          
          // Clear contextual emphasis modifiers
          node.classed("dimmed", false);
          link.classed("dimmed", false);
          link.classed("highlighted", false);
          link.attr("stroke", "#475569");
          
          const currentLang = localStorage.getItem('preferredLang') || 'en';
          document.getElementById("graph-tip").innerHTML = i18nData[currentLang]["tip-default"];
        })
        .on("click", (event, d) => {
          if (d.target) {
            window.location.href = d.target;
          }
        });

      d3NodeTextSelection = node.append("text")
        .attr("dx", d => d.radius + 8)
        .attr("dy", ".35em")
        .style("font-weight", d => d.group === "core" || d.group === "pillar" ? "600" : "400")
        .style("fill", d => d.group === "core" ? "#fff" : "#cbd5e1");

      // simulation.on("tick", () => {
      //   link
      //     .attr("x1", d => d.source.x)
      //     .attr("y1", d => d.source.y)
      //     .attr("x2", d => d.target.x)
      //     .attr("y2", d => d.target.y);

      //   node.attr("transform", d => `translate(${d.x},${d.y})`);
      // });

      // ... (Keep simulation, link, and node definitions the same)

      simulation.on("tick", () => {
        // Enriched Bounding Box Logic: Prevents nodes from bouncing outside the container viewport
        const padding = 30;
        
        link
          .attr("x1", d => Math.max(padding, Math.min(width - padding, d.source.x)))
          .attr("y1", d => Math.max(padding, Math.min(height - padding, d.source.y)))
          .attr("x2", d => Math.max(padding, Math.min(width - padding, d.target.x)))
          .attr("y2", d => Math.max(padding, Math.min(height - padding, d.target.y)));

        node.attr("transform", d => {
          d.x = Math.max(padding, Math.min(width - padding, d.x));
          d.y = Math.max(padding, Math.min(height - padding, d.y));
          return `translate(${d.x},${d.y})`;
        });
      });
      // Neighborhood structural lookup validation engine
      function isNeighbor(a, b) {
        return links.some(l => 
          (l.source.id === a.id && l.target.id === b.id) || 
          (l.source.id === b.id && l.target.id === a.id)
        );
      }

      function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
      }

      function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
      }

      function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
      }

      window.addEventListener("resize", () => {
        const w = container.clientWidth;
        const h = container.clientHeight;
        simulation.force("center", d3.forceCenter(w / 2, h / 2)).alpha(0.1).restart();
      });

      const savedLang = localStorage.getItem('preferredLang') || 'en';
      translatePage(savedLang);
    });
  </script>

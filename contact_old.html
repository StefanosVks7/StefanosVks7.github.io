<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact — Stefanos Voikos</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #020510;
      color: #e8eaf6;
      font-family: 'Source Sans 3', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    canvas#mlp-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Sidebar ── */
    .sidebar {
      height: 100%;
      width: 0;
      position: fixed;
      top: 0; left: 0;
      background: #111218;
      overflow-x: hidden;
      transition: width 0.3s ease;
      z-index: 100;
      display: flex;
      flex-direction: column;
    }

    .sidebar.open { width: 280px; }

    .sidebar-content {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 72px 0 32px;
      min-width: 280px;
    }

    .nav-links {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 28px;
      gap: 4px;
    }

    .nav-links a {
      color: #c8cfe8;
      text-decoration: none;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 1rem;
      font-weight: 400;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: color 0.2s;
    }

    .nav-links a:last-child { border-bottom: none; }
    .nav-links a:hover { color: #fff; }
    .nav-links a.active { color: #fff; font-weight: 600; }

    .sidebar-footer {
      padding: 24px 28px 0;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .sidebar-footer h3 {
      font-family: 'Raleway', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #7b8fc0;
      margin-bottom: 16px;
      text-align: center;
    }

    .social-icons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .social-icons a {
      color: #8b9fcf;
      font-size: 1.1rem;
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(120,140,210,0.25);
      display: flex; align-items: center; justify-content: center;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      text-decoration: none;
    }

    .social-icons a:hover {
      color: #fff;
      border-color: rgba(150,130,230,0.6);
      background: rgba(120,90,220,0.14);
    }

    /* ── Open button ── */
    .openbtn {
      position: fixed;
      top: 18px; left: 18px;
      z-index: 200;
      background: rgba(10,14,40,0.75);
      border: 1px solid rgba(120,140,210,0.25);
      border-radius: 8px;
      color: #c8cfe8;
      font-size: 1.2rem;
      width: 42px; height: 42px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, color 0.2s;
      backdrop-filter: blur(6px);
    }

    .openbtn:hover { background: rgba(120,90,220,0.25); color: #fff; }

    /* ── Overlay ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 99;
    }
    .overlay.show { display: block; }

    /* ── Main content ── */
    #main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      transition: margin-left 0.3s ease;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    header h1 {
      font-family: 'Raleway', sans-serif;
      font-weight: 700;
      font-size: clamp(2rem, 5vw, 3.2rem);
      letter-spacing: -0.5px;
      color: #fff;
      margin-bottom: 12px;
    }

    header p {
      font-size: 1rem;
      font-weight: 300;
      color: #8b9fcf;
      letter-spacing: 0.5px;
    }

    /* ── Form card ── */
    .card {
      width: 100%;
      max-width: 560px;
      background: rgba(10, 14, 40, 0.72);
      border: 1px solid rgba(120, 140, 210, 0.18);
      border-radius: 16px;
      padding: 44px 48px;
      backdrop-filter: blur(10px);
    }

    .field { margin-bottom: 24px; }

    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #7b8fc0;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(120, 140, 210, 0.22);
      border-radius: 8px;
      color: #e8eaf6;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 0.97rem;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.25s, background 0.25s;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    textarea:focus {
      border-color: rgba(150, 130, 230, 0.6);
      background: rgba(255,255,255,0.07);
    }

    input::placeholder,
    textarea::placeholder { color: rgba(180, 190, 225, 0.3); }

    textarea {
      resize: vertical;
      min-height: 130px;
      line-height: 1.6;
    }

    .divider {
      height: 1px;
      background: rgba(120, 140, 210, 0.15);
      margin: 32px 0;
    }

    .email-toggle { display: flex; gap: 12px; }

    .email-option { flex: 1; cursor: pointer; }
    .email-option input[type="radio"] { display: none; }

    .email-option .pill {
      display: block;
      text-align: center;
      padding: 11px 10px;
      border-radius: 8px;
      border: 1px solid rgba(120, 140, 210, 0.22);
      background: rgba(255,255,255,0.03);
      font-size: 0.82rem;
      color: #8b9fcf;
      transition: all 0.22s;
      word-break: break-all;
      line-height: 1.4;
    }

    .email-option input[type="radio"]:checked + .pill {
      border-color: rgba(150, 120, 240, 0.65);
      background: rgba(120, 90, 220, 0.14);
      color: #c5b8f7;
    }

    .email-option .pill:hover {
      border-color: rgba(150, 130, 230, 0.4);
      color: #c5b8f7;
    }

    .pill-label {
      display: block;
      font-size: 0.68rem;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 4px;
      opacity: 0.65;
    }

    .submit-btn {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      background: linear-gradient(135deg, rgba(100, 70, 200, 0.8), rgba(70, 50, 160, 0.9));
      border: 1px solid rgba(160, 130, 255, 0.35);
      border-radius: 8px;
      color: #fff;
      font-family: 'Raleway', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }

    .submit-btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .submit-btn:active { transform: scale(0.99); }

    .note {
      text-align: center;
      margin-top: 20px;
      font-size: 0.8rem;
      color: #5a6a9a;
    }

    @media (max-width: 540px) {
      .card { padding: 32px 20px; }
      .email-toggle { flex-direction: column; }
    }
  </style>
</head>
<body>

<canvas id="mlp-bg"></canvas>

<!-- Sidebar overlay -->
<div class="overlay" id="overlay" onclick="toggleNav()"></div>

<!-- Sidebar -->
<div id="mySidebar" class="sidebar">
  <div class="sidebar-content">
    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="thesis.html">Research & Dissertations</a>
      <a href="projects.html">Engineering Portfolio, Projects and Research</a>
      <a href="autobiography.html">Auto-Biography</a>

    </div>
    <div class="sidebar-footer">
      <h3>Contact</h3>
      <div class="social-icons">
        <a href="mailto:elstefanosvks7@gmail.com" title="Gmail"><i class="fa-regular fa-envelope"></i></a>
        <a href="mailto:stefvoikos@netmode.ntua.gr" title="NTUA Email"><i class="fa-regular fa-envelope"></i></a>
        <a href="https://www.instagram.com/stefanos_vks7/" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="https://www.facebook.com/profile.php?id=100054974571442" target="_blank" title="Facebook"><i class="fab fa-facebook"></i></a>
        <a href="https://github.com/StefanosVks7" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
      </div>
    </div>
  </div>
</div>

<!-- Toggle button -->
<button class="openbtn" onclick="toggleNav()" aria-label="Open menu">&#9776;</button>

<!-- Main -->
<div id="main">
  <header>
    <h1>Get in Touch</h1>
    <p>Electrical &amp; Computer Engineer &nbsp;|&nbsp; Data Scientist &nbsp;|&nbsp; ML Engineer</p>
  </header>

  <div class="card">
    <form id="contactForm" action="https://formspree.io/f/xwvjenlq" method="POST">

      <div class="field">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required />
      </div>

      <div class="field">
        <label for="sender">Your Email</label>
        <input type="email" id="sender" name="email" placeholder="you@example.com" required />
      </div>

      <div class="field">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="Research collaboration, inquiry…" required />
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Write your message here…" required></textarea>
      </div>

      <div class="divider"></div>

      <div class="field">
        <label>Send To</label>
        <div class="email-toggle">
          <label class="email-option">
            <input type="radio" name="recipient" value="elstefanosvks7@gmail.com" checked />
            <span class="pill">
              <span class="pill-label">Personal</span>
              elstefanosvks7@gmail.com
            </span>
          </label>
          <label class="email-option">
            <input type="radio" name="recipient" value="stefvoikos@netmode.ntua.gr" />
            <span class="pill">
              <span class="pill-label">Academic</span>
              stefvoikos@netmode.ntua.gr
            </span>
          </label>
        </div>
      </div>

      <input type="hidden" name="_replyto" id="replyto" value="elstefanosvks7@gmail.com" />
      <input type="hidden" name="_subject" value="New message from your website" />
      <button type="submit" class="submit-btn">Send Message</button>

    </form>
  </div>

  <p class="note">Responses within 1–2 business days</p>
</div>

<script>
  /* ── Sidebar toggle ── */
  function toggleNav() {
    const sidebar = document.getElementById('mySidebar');
    const overlay = document.getElementById('overlay');
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
  }

  /* ── Background (exact background_home.js) ── */
  const canvas = document.getElementById("mlp-bg");
  const ctx = canvas.getContext("2d");
  let W, H;
  let particles = [];
  let mouse = { x: null, y: null };
  const particleCount = 120;
  const maxDistance = 120;

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(dpr, dpr);
    initParticles();
  }

  window.addEventListener("resize", resizeCanvas);
  window.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener("mouseleave", () => { mouse.x = null; mouse.y = null; });

  function initParticles() {
    particles = [];
    for (let i = 0; i < particleCount; i++) {
      particles.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        size: Math.random() * 2 + 1
      });
    }
  }

  function drawBackground() {
    const gradient = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, H);
    gradient.addColorStop(0, "#0b0f1a");
    gradient.addColorStop(1, "#000000");
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);
  }

  function updateParticles() {
    for (let p of particles) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      if (mouse.x !== null) {
        const dx = p.x - mouse.x, dy = p.y - mouse.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 150) { p.vx += dx * 0.0003; p.vy += dy * 0.0003; }
      }
    }
  }

  function drawParticles() {
    ctx.shadowColor = "rgba(120,200,255,0.7)";
    ctx.shadowBlur = 10;
    for (let p of particles) {
      ctx.fillStyle = "rgba(180,200,255,0.9)";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  function drawConnections() {
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const a = particles[i], b = particles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < maxDistance) {
          const alpha = 1 - dist / maxDistance;
          ctx.strokeStyle = "rgba(150,180,255," + (alpha * 0.3) + ")";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }
  }

  function animate() {
    drawBackground();
    updateParticles();
    drawConnections();
    drawParticles();
    requestAnimationFrame(animate);
  }

  resizeCanvas();
  animate();

  /* ── Switch Formspree endpoint based on selected email ── */
  const endpoints = {
    'elstefanosvks7@gmail.com': 'https://formspree.io/f/xwvjenlq',
    'stefvoikos@netmode.ntua.gr': 'https://formspree.io/f/maqzwdba'
  };
  const form = document.getElementById('contactForm');
  document.querySelectorAll('input[name="recipient"]').forEach(radio => {
    radio.addEventListener('change', function() {
      form.action = endpoints[this.value];
      document.getElementById('replyto').value = this.value;
    });
  });
</script>
</body>
</html>

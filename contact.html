<head>

  <style>
    /* Background canvas */
    #mlp-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      background: black;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #020510;
      color: #e8eaf6;
      font-family: 'Source Sans 3', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .nav-links {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 28px;
      gap: 4px;
    }

    /* .nav-links a {
      color: #c8cfe8;
      text-decoration: none;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 1rem;
      font-weight: 400;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: color 0.2s;
    }

    .nav-links a:last-child { border-bottom: none; }
    .nav-links a:hover { color: #fff; }
    .nav-links a.active { color: #fff; font-weight: 600; } */

    .social-icons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .social-icons a {
      color: #8b9fcf;
      font-size: 1.1rem;
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(120,140,210,0.25);
      display: flex; align-items: center; justify-content: center;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      text-decoration: none;
    }

    .social-icons a:hover {
      color: #fff;
      border-color: rgba(150,130,230,0.6);
      background: rgba(120,90,220,0.14);
    }

    /* ── Open button ── */
    .openbtn {
      position: fixed;
      top: 18px; left: 18px;
      z-index: 200;
      background: rgba(10,14,40,0.75);
      border: 1px solid rgba(120,140,210,0.25);
      border-radius: 8px;
      color: #c8cfe8;
      font-size: 1.2rem;
      width: 42px; height: 42px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, color 0.2s;
      backdrop-filter: blur(6px);
    }

    .openbtn:hover { background: rgba(120,90,220,0.25); color: #fff; }

    /* ── Overlay ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 99;
    }
    .overlay.show { display: block; }

    /* ── Main content ── */
    #main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      transition: margin-left 0.3s ease;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    header h1 {
      font-family: 'Raleway', sans-serif;
      font-weight: 700;
      font-size: clamp(2rem, 5vw, 3.2rem);
      letter-spacing: -0.5px;
      color: #fff;
      margin-bottom: 12px;
    }

    header p {
      font-size: 1rem;
      font-weight: 300;
      color: #8b9fcf;
      letter-spacing: 0.5px;
    }

    /* ── Form card ── */
    .card {
      width: 100%;
      max-width: 560px;
      background: rgba(10, 14, 40, 0.72);
      border: 1px solid rgba(120, 140, 210, 0.18);
      border-radius: 16px;
      padding: 44px 48px;
      backdrop-filter: blur(10px);
    }

    .field { margin-bottom: 24px; }

    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #7b8fc0;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(120, 140, 210, 0.22);
      border-radius: 8px;
      color: #e8eaf6;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 0.97rem;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.25s, background 0.25s;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    textarea:focus {
      border-color: rgba(150, 130, 230, 0.6);
      background: rgba(255,255,255,0.07);
    }

    input::placeholder,
    textarea::placeholder { color: rgba(180, 190, 225, 0.3); }

    textarea {
      resize: vertical;
      min-height: 130px;
      line-height: 1.6;
    }

    .divider {
      height: 1px;
      background: rgba(120, 140, 210, 0.15);
      margin: 32px 0;
    }

    .email-toggle { display: flex; gap: 12px; }

    .email-option { flex: 1; cursor: pointer; }
    .email-option input[type="radio"] { display: none; }

    .email-option .pill {
      display: block;
      text-align: center;
      padding: 11px 10px;
      border-radius: 8px;
      border: 1px solid rgba(120, 140, 210, 0.22);
      background: rgba(255,255,255,0.03);
      font-size: 0.82rem;
      color: #8b9fcf;
      transition: all 0.22s;
      word-break: break-all;
      line-height: 1.4;
    }

    .email-option input[type="radio"]:checked + .pill {
      border-color: rgba(150, 120, 240, 0.65);
      background: rgba(120, 90, 220, 0.14);
      color: #c5b8f7;
    }

    .email-option .pill:hover {
      border-color: rgba(150, 130, 230, 0.4);
      color: #c5b8f7;
    }

    .pill-label {
      display: block;
      font-size: 0.68rem;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 4px;
      opacity: 0.65;
    }

    .submit-btn {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      background: linear-gradient(135deg, rgba(100, 70, 200, 0.8), rgba(70, 50, 160, 0.9));
      border: 1px solid rgba(160, 130, 255, 0.35);
      border-radius: 8px;
      color: #fff;
      font-family: 'Raleway', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }

    .submit-btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .submit-btn:active { transform: scale(0.99); }

    .note {
      text-align: center;
      margin-top: 20px;
      font-size: 0.8rem;
      color: #5a6a9a;
    }

    @media (max-width: 540px) {
      .card { padding: 32px 20px; }
      .email-toggle { flex-direction: column; }
    }
  </style>
</head>

    <p>Electrical &amp; Computer Engineer &nbsp;|&nbsp; Data Scientist &nbsp;|&nbsp; ML Engineer</p>
  </header>

  <div class="card">
    <form id="contactForm" action="https://formspree.io/f/xwvjenlq" method="POST">

      <div class="field">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required />

      <div class="field">
        <label for="sender">Your Email</label>
        <input type="email" id="sender" name="email" placeholder="you@example.com" required />
      </div>

      <div class="field">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="Research collaboration, inquiry…" required />
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Write your message here…" required></textarea>
      </div>

      <div class="divider"></div>

      <div class="field">

        <div class="email-toggle">
          <label class="email-option">
            <input type="radio" name="recipient" value="elstefanosvks7@gmail.com" checked />

              <span class="pill-label">Personal</span>
              elstefanosvks7@gmail.com
            </span>
          </label>
          <label class="email-option">
            <input type="radio" name="recipient" value="stefvoikos@netmode.ntua.gr" />
            <span class="pill">
              <span class="pill-label">Academic</span>
              stefvoikos@netmode.ntua.gr
            </span>
          </label>
        </div>
      </div>

      <input type="hidden" name="_replyto" id="replyto" value="elstefanosvks7@gmail.com" />
      <input type="hidden" name="_subject" value="New message from your website" />
      <button type="submit" class="submit-btn">Send Message</button>

    </form>
  </div>

    // --- Master Translation Execution Engine ---
    function translatePage(lang) {
      // Safe fallback mechanism if translations are not yet provided for all 20 options
      const dict = i18nData[lang] || i18nData["en"];
      localStorage.setItem('preferredLang', lang);
      document.getElementById("language-selector").value = lang;

      // Translate standard text arrays
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (dict[key]) el.textContent = dict[key];
      });

      // Handle HTML paragraph blocks cleanly
      if (dict["about-p1"]) document.getElementById("about-p1").innerHTML = dict["about-p1"];
      if (dict["about-p2"]) document.getElementById("about-p2").innerHTML = dict["about-p2"];
      
      // Update interactive tooltip base strings
      const currentTip = document.getElementById("graph-tip");
      if (currentTip && dict["tip-default"]) currentTip.innerHTML = dict["tip-default"];

      // Reactive update to the live D3 Canvas strings safely
      if (d3NodeTextSelection) {
        d3NodeTextSelection.text(d => dict[d.i18nKey] || d.id);
      }
    }
    
    // Runs immediately when the document is parsing and elements are ready
    document.addEventListener("DOMContentLoaded", () => {
